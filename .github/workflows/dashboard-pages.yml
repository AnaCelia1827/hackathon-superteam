name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/dashboard/**
      - docs/demo/looprail-demo-en.mp4
      - .github/workflows/dashboard-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static dashboard
        run: |
          mkdir -p _site
          cp -R apps/dashboard/. _site/
          cp docs/demo/looprail-demo-en.mp4 _site/demo.mp4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
