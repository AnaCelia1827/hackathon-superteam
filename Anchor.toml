[toolchain]
anchor_version = "1.0.2"

[workspace]
members = ["programs/*"]

[features]
resolution = true
skip-lint = false

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[programs.localnet]
looprail_session = "Eidxr4sVDqni1pTjLgKZFXVXTTP84fm6GNpHZRbWXFh6"

[scripts]
test = ". ./scripts/local-env.sh && npx ts-mocha -p ./tsconfig.json -t 1000000 tests/session-logic.ts"
"test:er" = ". ./scripts/local-env.sh && npx ts-mocha -p ./tsconfig.json -t 1000000 tests/session-er.ts"
